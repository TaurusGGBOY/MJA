[project]
name = "mja"
version = "0.1.0"
description = "MaaFramework automation for the macOS iOS build of 对决剑之川"
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
