name: MFW foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python-version }}
      - name: Run MFW foundation tests
        run: >-
          uv run --python ${{ matrix.python-version }} --no-project
          --with-requirements requirements.txt --with pytest --with ruff
          pytest tests/test_mfw_*.py tests/test_capture_mfw_fixture.py -q
      - name: Run Ruff
        run: >-
          uv run --python ${{ matrix.python-version }} --no-project
          --with-requirements requirements.txt --with ruff
          ruff check agent/custom tools tests/mfw tests/test_mfw_*.py
          tests/test_capture_mfw_fixture.py

  resource:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - name: Assemble a current resource candidate
        run: >-
          uv run --python 3.14 --no-project --with-requirements requirements.txt
          python tools/mfw_install.py --output install/ci-resource-candidate
      - name: Load the resource with MaaFramework
        run: >-
          uv run --python 3.14 --no-project --with-requirements requirements.txt
          python tools/load_mfw_resource.py install/ci-resource-candidate
      - name: Check the resource graph
        run: python3 tools/check_mfw_resources.py install/ci-resource-candidate/resource/base

  package:
    needs: [python, resource]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - name: Assemble the isolated candidate
        run: >-
          uv run --python 3.14 --no-project --with-requirements requirements.txt
          python tools/mfw_install.py --output install/ci-candidate
      - name: Verify candidate identity and payload
        run: >-
          uv run --python 3.14 --no-project --with-requirements requirements.txt
          python tools/mfw_install.py --verify-candidate install/ci-candidate
      - name: Check candidate resources
        run: python3 tools/check_mfw_resources.py install/ci-candidate/resource/base
      - name: Compile the embedded Agent source
        run: >-
          python3 -c "from pathlib import Path; [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in Path('agent').rglob('*.py')]"
      - name: Upload candidate-not-releasable artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-not-releasable
          path: |
            install/ci-candidate
            install/ci-candidate/build-metadata.json
          if-no-files-found: error
